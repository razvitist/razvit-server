services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - app
  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Europe/Moscow
    volumes:
      - db:/var/lib/postgresql
    expose:
      - '5432'
    networks:
      - app
  api:
    restart: unless-stopped
    build:
      context: .
    depends_on:
      - db
    env_file:
      - .env
    expose:
      - '8000'
    networks:
      - app
    environment:
      - TZ=Europe/Moscow

volumes:
  db:
  caddy_data:
  caddy_config:

networks:
  app:
